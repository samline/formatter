# The website's own checks and the package smoke tests the managed CI does not
# run (not managed by the family template). pnpm installs, Bun runs the scripts.
name: Website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - name: Smoke-test the built output and the npm archive
        run: bun run build && bun run test:package
      - run: bun run site:check
      - run: bun run site:format:check
      - run: bun run site:test
      - run: bun run site:test:adaptation
      - run: bun run site:build
      - run: bun run site:check:release
      # Chromium only, without --with-deps: the runner already has its libraries.
      - run: pnpm exec playwright install chromium
        timeout-minutes: 5
      - run: bun run site:test:browser
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
